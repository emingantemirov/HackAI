name: AuditFlow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
        if: matrix.python-version == '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q auditflow
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check auditflow/static/app.js
      - run: node --check scripts/browser_smoke.cjs
      - run: node --check auditflow/static/automation.js
      - run: node --check scripts/automation_smoke.cjs
      - run: node --check auditflow/static/workspace.js
      - run: node --check auditflow/static/library.js
      - run: node --check auditflow/static/workflow.js
      - run: node --check auditflow/static/icons.js
      - run: node scripts/frontend_contracts.cjs
      - run: node --check auditflow/static/controls.js
      - run: node --check auditflow/static/locale.js
      - run: node scripts/controls_contracts.cjs
      - run: node --check auditflow/static/customers.js
      - run: node scripts/customers_contracts.cjs
      - run: node --check scripts/document_review_smoke.cjs
      - run: node --check scripts/workspace_smoke.cjs
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
